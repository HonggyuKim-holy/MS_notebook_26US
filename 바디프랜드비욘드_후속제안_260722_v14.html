    // its OWN frames — from local text at the root, or text obtained from

      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

;border-radius:50%;background:var(--gold-soft)}\n  .rel{display:flex;align-items:center;gap:13px;margin:2px 0 14px}\n  .rel .rbox{background:#F6EFDC;border:1px solid rgba(169,131,42,.45);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:800;color:var(--ink)}\n  .rel .rbox span{display:block;font-size:10.5px;font-weight:700;color:#8F7F68;margin-top:1px}\n  .rel .rarr{color:var(--gold);font-weight:800;font-size:18px}\n  @media print{\n    body{background:#fff}\n    .slide{margin:0;box-shadow:none;page-break-after:always}\n    @page{size:1280px 720px;margin:0}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<!-- 1 · COVER -->\n<div class=\"slide dark\">\n  <div class=\"shead\"><span>Confidential · 바디프랜드 귀중<\u002Fspan><span>LICHE · 2026.07<\u002Fspan><\u002Fdiv>\n  <div class=\"center\">\n    <div class=\"kicker\">Bodyfriend Beyond · Membership Metaverse<\u002Fdiv>\n    <div style=\"font-size:14px;color:#C7AD6F;font-weight:700;letter-spacing:.12em;margin-top:14px\">바디프랜드 멤버십 메타버스<\u002Fdiv>\n    <div class=\"cover-title\">바디프랜드 비욘드<\u002Fdiv>\n    <div class=\"cover-sub\">첫 2개월 — 계약 ① 구현 범위 제안<\u002Fdiv>\n    <div class=\"hr-gold\"><\u002Fdiv>\n    <div class=\"cover-quote\">\n      <b style=\"color:var(--gold-bright);font-size:17.5px\">9월, 새 라인업과 함께 계정 기반의 고객 경험이 시작됩니다.<\u002Fb><br>\n      이 문서는 그 첫 고객을 맞을 <b>멤버십 앱을 두 달 안에 준비<\u002Fb>하는 계획입니다.\n    <\u002Fdiv>\n    <div class=\"hr-gold\"><\u002Fdiv>\n    <div class=\"tagline\">제안 리체 · 바디프랜드 전용 프로젝트 · 대외비<\u002Fdiv>\n    <div class=\"tagline\" style=\"margin-top:10px;font-size:10px;letter-spacing:.06em;color:#8F7C5E\">본 문서에 언급된 출시 일정·제품 관련 내용은 협의 과정에서 논의된 계획을 기준으로 하며, 공식 확정에 따릅니다.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 2 · 왜 지금 — 9월 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>01 · 왜 지금인가<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">01 · 왜 지금인가 — 9월이 정해 준 일정<\u002Fdiv>\n  <h1 class=\"serif\">9월,<br>기기 사용이 <span class=\"g\">계정과 결합<\u002Fspan>되기 시작합니다.<\u002Fh1>\n  <p class=\"lead\">9월, AI 프로 라인업(다빈치·퀀텀·733)의 출시와 함께 마사지맵 자동 생성 기능이 도입됩니다.<br>이 기능은 계정 로그인 위에서 동작하므로 — 고객 계정과 결합된 사용 이력 데이터의 수집이 이때부터 본격화됩니다.<\u002Fp>\n  <div class=\"tl9\" style=\"margin-top:24px\">\n    <div class=\"node hot\">2026년 7월 — 계약 ① 착수<\u002Fdiv>\n    <div class=\"seg\" style=\"flex:2\"><span>8주 — 검증 · 구현 · 설계<\u002Fspan><\u002Fdiv>\n    <div class=\"node\">9월 — AI 프로 출시 · 첫 로그인<\u002Fdiv>\n    <div class=\"seg\" style=\"flex:3;background:#E4D8BC\"><span>계정 결합 데이터가 쌓이는 기간<\u002Fspan><\u002Fdiv>\n    <div class=\"node\" style=\"background:#EAE0C6;color:#7A6335\">12월 — 기존 AI 제품까지 확대 · 베타<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cols c3\">\n    <div class=\"card\"><h4><span class=\"num\">1<\u002Fspan>AI 프로 출시<\u002Fh4><p>생성형 AI가 맞춤 마사지맵을 만들어 주는 새 라인업 — <b>데이터 전략의 전환점이 될 시점<\u002Fb>입니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h4><span class=\"num\">2<\u002Fspan>계정 결합의 시작<\u002Fh4><p>마사지맵을 쓰려면 계정이 필요합니다. <b>고객 정보와 묶인 기기 사용 데이터<\u002Fb>가 이 순간부터 쌓입니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card gold\"><h4><span class=\"num\">3<\u002Fspan>첫인상은 한 번입니다<\u002Fh4><p>천만 원대 기기를 들인 고객이 처음 여는 화면 — 거기에 <b>리포트·코인·혜택이 바로 보여야<\u002Fb> 로그인이 습관이 됩니다. 그 화면을 준비하는 것이 계약 ①입니다.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">계정이 만들어지는 달에, 계정에 담길 이유가 함께 있어야 합니다 — <span class=\"g\">준비 시한은 2026년 7월 착수<\u002Fspan>입니다.<\u002Fdiv>\n  <div class=\"docstrip\">비욘드의 전체 구상(세계관·4개 층·등급·코인 3단계)은 7월 16일 발표로 갈음합니다 · 이 문서는 계약 ①(2개월)의 실행 범위만 다룹니다<\u002Fdiv>\n  <div class=\"sfoot\">02 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 3 · 첫 로그인의 장면 (목업) -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>02 · 첫 로그인의 장면<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">02 · 첫 로그인의 장면 — 9월, 고객이 만나는 화면<\u002Fdiv>\n  <h1 class=\"serif\">첫 3분 — 고객은 <span class=\"g\">이런 화면<\u002Fspan>을 만납니다.<\u002Fh1>\n  <div class=\"phones\">\n    <div class=\"phwrap\">\n      <div class=\"ph\"><div class=\"scr\">\n        <div class=\"top\"><span class=\"logo\">BODYFRIEND BEYOND<\u002Fspan><\u002Fdiv>\n        <div class=\"htxt\">반갑습니다,<br>멤버가 되셨습니다<\u002Fdiv>\n        <div class=\"stxt\">기기 등록이 확인되었습니다.<br>당신의 멤버십이 열립니다.<\u002Fdiv>\n        <div class=\"wcard\"><div class=\"wl g\" style=\"width:70%\"><\u002Fdiv><div class=\"wl\" style=\"width:45%;margin-top:6px\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"toast\"><span class=\"c\">W<\u002Fspan>웰컴 코인이 도착했습니다<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div class=\"phcap\"><div class=\"t\">온보딩 <span class=\"tag sample\">샘플<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"phwrap\">\n      <div class=\"ph\"><div class=\"scr\">\n        <div class=\"top\"><span class=\"logo\">내 몸 리포트<\u002Fspan><span class=\"coin\">주간<\u002Fspan><\u002Fdiv>\n        <div class=\"htxt\">지난주의 나<\u002Fdiv>\n        <div class=\"chart\"><i style=\"height:34%\"><\u002Fi><i style=\"height:52%\"><\u002Fi><i style=\"height:40%\"><\u002Fi><i style=\"height:66%\"><\u002Fi><i style=\"height:58%\"><\u002Fi><i style=\"height:82%\"><\u002Fi><i style=\"height:74%\"><\u002Fi><\u002Fdiv>\n        <div class=\"wcard\"><div class=\"stxt\"><b style=\"font-size:10px;color:#2B2115\">오늘의 미션<\u002Fb><br>목·어깨 집중 케어 15분<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div class=\"phcap\"><div class=\"t\">내 몸 리포트 <span class=\"tag live\">실데이터<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"phwrap\">\n      <div class=\"ph\"><div class=\"scr\">\n        <div class=\"top\"><span class=\"logo\">건강코인<\u002Fspan><span class=\"coin\">1,240 C<\u002Fspan><\u002Fdiv>\n        <div class=\"htxt\">케어를 마쳤습니다<\u002Fdiv>\n        <div class=\"toast\"><span class=\"c\">+<\u002Fspan>15 코인 적립<\u002Fdiv>\n        <div class=\"wcard\"><div class=\"stxt\"><b style=\"font-size:10px;color:#2B2115\">이번 주 3회째<\u002Fb> — 연속 기록이 쌓이는 중<\u002Fdiv><div class=\"wl g\" style=\"width:60%;margin-top:6px\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <div class=\"phcap\"><div class=\"t\">코인 루프 <span class= n>을 만듭니다.<\u002Fh1>\n  <p class=\"lead\">전 기능의 일부를 넓게 만드는 것이 아니라 —<br><b>한 고객이 처음부터 끝까지 겪는 완결된 경험 하나<\u002Fb>를 완성합니다. 대작 게임이 본개발 전에 반드시 거치는 검증 방식입니다.<\u002Fp>\n  <div class=\"dlv\">\n    <div class=\"item\">\n      <div class=\"stage\">\n        <div class=\"miniph\"><div class=\"ms\">\n          <div class=\"mlogo\">BODYFRIEND BEYOND<\u002Fdiv>\n          <div class=\"mh\">지난주의 나<\u002Fdiv>\n          <div class=\"mchart\"><i style=\"height:40%\"><\u002Fi><i style=\"height:62%\"><\u002Fi><i style=\"height:48%\"><\u002Fi><i style=\"height:80%\"><\u002Fi><i style=\"height:70%\"><\u002Fi><\u002Fdiv>\n          <div class=\"mtoast\">+15 코인 적립<\u002Fdiv>\n          <div class=\"mh\" style=\"font-size:7.5px;color:#7A6335\">라운지까지 65%<\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <h4><span class=\"num\">1<\u002Fspan>동작하는 앱<\u002Fh4>\n      <p>앞 장의 다섯 장면이 <b>하나의 흐름<\u002Fb>으로 — 기기 연동을 받을 준비가 된 상태로 완성됩니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"item\">\n      <div class=\"stage\">\n        <div class=\"doc\">\n          <div class=\"dtit\">검증 리포트<\u002Fdiv>\n          <div class=\"dchart\"><i style=\"height:55%\"><\u002Fi><i style=\"height:78%\"><\u002Fi><i style=\"height:42%\"><\u002Fi><i style=\"height:90%\"><\u002Fi><i style=\"height:64%\"><\u002Fi><i style=\"height:72%\"><\u002Fi><\u002Fdiv>\n          <div class=\"dnum\">연동 가능 모수 ○○,○○○<\u002Fdiv>\n          <div class=\"dl g\" style=\"width:76%\"><\u002Fdiv>\n          <div class=\"dl\" style=\"width:58%\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <h4><span class=\"num\">2<\u002Fspan>숫자로 확정한 검증<\u002Fh4>\n      <p>팬텀·파라오 실측으로 <b>리포트 성립 범위와 공식 모수 확정<\u002Fb> + 9월 데이터 수집 체계 설계.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"item\">\n      <div class=\"stage\">\n        <div class=\"dstack\">\n          <div class=\"doc b1\"><div class=\"dtit\">KPI 체계<\u002Fdiv><div class=\"dl\" style=\"width:80%\"><\u002Fdiv><div class=\"dl\" style=\"width:64%\"><\u002Fdiv><div class=\"dl g\" styl n      <div class=\"fa\" style=\"bottom:46px;right:46px;transform:rotate(135deg)\">▸<\u002Fdiv>\n      <div class=\"fa\" style=\"bottom:46px;left:46px;transform:rotate(225deg)\">▸<\u002Fdiv>\n      <div class=\"fa\" style=\"top:46px;left:46px;transform:rotate(315deg)\">▸<\u002Fdiv>\n      <div class=\"fc\">리워드<br>선순환<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cols\" style=\"grid-template-columns:1fr;gap:9px;align-content:center;font-size:12.8px\">\n      <div class=\"card gold\" style=\"padding:12px 16px\"><h4><span class=\"num\">1<\u002Fspan>구독 — 전환보다 유지가 승부입니다<\u002Fh4><p style=\"font-size:12.7px;line-height:1.55\">연말로 준비 중인 AI 기능 구독이 시작되면, <b>파는 것보다 지키는 것이 어려운 사업<\u002Fb>이 함께 시작됩니다. 넷플릭스가 보여줬듯 구독을 지키는 것은 <b>매일 열어 볼 이유<\u002Fb>입니다 — 리포트·코인·혜택이 그 이유를 만들고, 유지율이 곧 매출이 됩니다.<\u002Fp><\u002Fdiv>\n      <div class=\"card gold\" style=\"padding:12px 16px\"><h4><span class=\"num\">2<\u002Fspan>재구매 · 업셀<\u002Fh4><p style=\"font-size:12.7px;line-height:1.55\">새 AI 기능은 신규 라인업에서 시작되므로 <b>기존 기기 고객이 가장 가까운 업그레이드 수요층<\u002Fb>입니다. 등급과 코인이 그 교체 수요와 가족의 첫 구매를 회사 안으로 되돌립니다.<\u002Fp><\u002Fdiv>\n      <div class=\"card gold\" style=\"padding:12px 16px\"><h4><span class=\"num\">3<\u002Fspan>직거래 매출<\u002Fh4><p style=\"font-size:12.7px;line-height:1.55\">셀렉트는 검증된 회원에게만 여는 자기 채널 — <b>판매수수료 없는 회원 전용 매출<\u002Fb>이 기존 직판 채널 위에 더해집니다.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">여기에 733 소사이어티 — <span class=\"g\">VIP를 대접하는 회사<\u002Fspan>라는 브랜드 자산까지. 리워드는 판매의 끝이 아니라 <span class=\"g\">다음 매출의 시작점<\u002Fspan>에 서 있습니다.<\u002Fdiv>\n  <div class=\"sfoot\">07 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 6 · 어떻게 2개월이 가능한가 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>06 · 수행 방식<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">06 · 수행 방식 — 두 달이 가능한 이유<\u002Fdiv>\n  <h1 class=\"serif\">두 달이 가능한 이유 —<br><span class=\"g\">100% AI 네이티브 개발<\u002Fspan>입니다.<\u002Fh1>\n  <p class=\"lead\">개발 속도의 문제이자 — 이후 수년간의 운영·유지보수 비용 구조의 문제입니다.<br>세 트랙이 순차가 아니라 겹쳐 달리기에, 8주가 성립합니다.<\u002Fp>\n  <div class=\"gantt\">\n    <div class=\"ghead\">\n      <div><\u002Fdiv>\n      <div class=\"wkhead\"><span>1주<\u002Fspan><span>2주<\u002Fspan><span>3주<\u002Fspan><span>4주<\u002Fspan><span>5주<\u002Fspan><span>6주<\u002Fspan><span>7주<\u002Fspan><span>8주<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grow\">\n      <div class=\"glabel\">A · 검증<\u002Fdiv>\n      <div class=\"glane\">\n        <div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv>\n        <div class=\"bar a\" style=\"grid-column:1/span 4\">데이터 실측 · 모수 확정 · 수집 설계<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grow\">\n      <div class=\"glabel\">B · 구현<\u002Fdiv>\n      <div class=\"glane\">\n        <div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv>\n        <div class=\"bar b\" style=\"grid-column:3/span 6\">리포트 · 코인 루프 · 등급 · 온보딩<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grow\">\n      <div class=\"glabel\">C · 설계<\u002Fdiv>\n      <div class=\"glane\">\n        <div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv><div class=\"cell\"><\u002Fdiv>\n        <div class=\"bar c\" style=\"grid-column:5/span 4\">혜택 원가 · KPI · 투입 · 역할 분담안<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cols c3\" style=\"margin-top:8px;flex:0 0 auto\">\n    <div class=\"card\"><h4>속도<\u002Fh4><p>소수 정예 × AI 개발 — 계절·캠페인 콘텐츠를 개발자 손을 거의 거치지 않고 갱신하는 구조까지 함께 만들어집니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h4>단일 코드베이스<\u002Fh4><p>AI 개발·유지보수 효율은 <b>하나의 일관된 코드베이스<\u002Fb>에서 극대화됩니다 — 검증 단계를 단일 코드베이스로 시작하는 이유입니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h4>해 본 손<\u002Fh4><p>리체 개발진은 <b>누적 1,200만 명이 즐긴 라이브 서비스<\u002Fb>를 설계·운영했습니다. 이 규모의 리텐션 설계를 만들어 본 경험이 8주의 근거입니다.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sfoot\">08 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 7 · 왜 리체 단독인가 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>06 · 수행 방식<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">06 · 수행 방식 — 두 달의 역할<\u002Fdiv>\n  <h1 class=\"serif\">바디프랜드는 <span class=\"g\">출시에 집중<\u002Fspan>하십시오.<br>두 달 뒤, 결과만 판정하시면 됩니다.<\u002Fh1>\n  <p class=\"lead\">9월 출시를 앞둔 시기입니다 —<br>검증 2개월은 리체가 전담하고, 바디프랜드는 별도 개발 인력 투입 없이 결과를 받아 보시면 됩니다.<\u002Fp>\n  <div class=\"rel\">\n    <div class=\"rbox\">리체<span>2개월 전담 실행<\u002Fspan><\u002Fdiv>\n    <div class=\"rarr\">→<\u002Fdiv>\n    <div class=\"rbox\" style=\"background:#FFFDF6\">동작하는 앱 + 검증 데이터 + 마스터플랜<span>납품물 일체<\u002Fspan><\u002Fdiv>\n    <div class=\"rarr\">→<\u002Fdiv>\n    <div class=\"rbox\">바디프랜드<span>검수 · 판정 · 다음 결정<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cols c3\">\n    <div class=\"card gold\"><h4>원안 그대로 검증<\u002Fh4><p>이번 두 달의 산출물은 <b>\"발표된 구상이 실제로 작동하는가\"에 대한 답<\u002Fb>이어야 합니다. 리체는 구상 원안을 그대로 구현하고, 그 원안으로 판정받겠습니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card gold\"><h4>책임의 단일화<\u002Fh4><p>리체가 전담하므로 결과가 부족하면 <b>원인이 명확합니다<\u002Fb> — 판정이 쉬운 구조가 다음 결정을 빠르게 만듭니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card gold\"><h4>겹치는 부분은 두 달 뒤, 결과 위에서 정리합니다<\u002Fh4><p>새 멤버십 앱은 기존 앱·기기 기능과 자연히 맞닿습니다. 어디를 합치고 어디를 나눌지를 지금 추측으로 정하지 않는 것 — 그것이 이 두 달의 설계입니다. 동작하는 결과를 보신 뒤, <b>리체 단독이든 하이브리드든 바디프랜드가 정하시면 됩니다.<\u002Fb><\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">실행은 리체가, 결정은 바디프랜드가 맡는 두 달입니다 — <span class=\"g\">판단 재료(역할 분담안)는 리체가 만들어 제출<\u002Fspan>합니다.<\u002Fdiv>\n  <div class=\"sfoot\">09 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 11 · 8주 일정 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>07 · 일정과 진행<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">07 · 8주 일정 · 보고 체계<\u002Fdiv>\n  <h1 class=\"serif\">6주차에 동작 버전이 나오고,<br>8주차에 <span class=\"g\">9월 첫 로그인을 받을 준비<\u002Fspan>가 끝납니다.<\u002Fh1>\n  <div class=\"wkline\">\n    <div class=\"wkbox\">1주<\u002Fdiv>\n    <div class=\"wkbox rep\">2주<span class=\"rp\">서면 보고<\u002Fspan><\u002Fdiv>\n    <div class=\"wkbox\">3주<\u002Fdiv>\n    <div class=\"wkbox rep\">4주<span class=\"chip\">검증 리포트 · 목표치 합의<\u002Fspan><span class=\"rp\">서면 보고<\u002Fspan><\u002Fdiv>\n    <div class=\"wkbox\">5주<\u002Fdiv>\n    <div class=\"wkbox hot rep\">6주<span class=\"chip hot\">슬라이스 α — 출시 전 도달<\u002Fspan><span class=\"rp\">서면 보고<\u002Fspan><\u002Fdiv>\n    <div class=\"wkbox\">7주<\u002Fdiv>\n    <div class=\"wkbox rep\">8주<span class=\"chip\">최종 납품 · 출시 대응<\u002Fspan><span class=\"rp\">서면 보고<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cols c3\" style=\"margin-top:20px\">\n    <div class=\"card\"><h4>착수 시점이 여유를 정합니다<\u002Fh4><p>7월 안에 착수하면 <b>동작 버전(α)이 9월 출시 전에 도달<\u002Fb>합니다. 착수가 늦어질수록 α와 출시 사이의 여유가 줄어듭니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h4>전자계약 · 2주 단위 서면 보고<\u002Fh4><p>계약은 전자계약으로 진행하고, 진행 상황을 2주 단위 서면 보고로 공유합니다 — 대면 없이도 진행이 멈추지 않는 체계입니다.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h4>목표치는 4주차에 함께 확정<\u002Fh4><p>KPI 목표치는 <b>4주차 검증 리포트에서 실측 근거와 함께 양사 합의로 확정<\u002Fb>합니다 — 책임질 수 있는 숫자만 약속합니다.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">필요한 협조는 <span class=\"g\">고객 동의·보안 절차 안에서의 데이터 접근<\u002Fspan>, 그리고 주 1회 창구 협의 — 이 두 가지면 충분합니다.<\u002Fdiv>\n  <div class=\"sfoot\">10 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 10 · 지금 여는 것 / 검증이 여는 것 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>08 · 다음 단계<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">08 · 지금 여는 것, 검증이 여는 것<\u002Fdiv>\n  <h1 class=\"serif\">계약 ①은 <span class=\"g\">첫 번째 문<\u002Fspan>입니다 —<br>나머지 문은 검증이 엽니다.<\u002Fh1>\n  <p class=\"lead\">아래 오른쪽은 하지 않는 일이 아니라 — <b>이번 검증을 통과하면 하게 될 일<\u002Fb>입니다.<br>순서를 지키는 것이 전체를 가장 빨리 가는 길입니다.<\u002Fp>\n  <div class=\"cols c2\">\n    <div class=\"card gold\"><div class=\"door open\"><\u002Fdiv><h4>지금 — 계약 ①이 여는 것 (2개월)<\u002Fh4>\n      <ul>\n        <li>9월 출시 고객을 맞는 <b>동작하는 멤버십 앱<\u002Fb> (첫 로그인 ~ 등급까지)<\u002Fli>\n        <li>씨앗 3,000가구 파일럿 설계와 <b>데이터 실측 · 수집 체계<\u002Fb><\u002Fli>\n        <li>혜택 마스터플랜 · 원가 모델 · KPI · 투입 산출 · 역할 분담안<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\"><div class=\"door closed\"><\u002Fdiv><h4>검증 통과 후 — 다음 계약이 여는 것<\u002Fh4>\n      <ul>\n        <li><b>확산<\u002Fb> — 기존 고객 150만을 불러오는 유입 설계, 활성 10만으로<\u002Fli>\n        <li><b>코인 경제 2·3단계<\u002Fb> — 크레딧·시장 개방 (별도 승인)<\u002Fli>\n        <li><b>소사이어티 거래 보증<\u002Fb> — 인증·보증·평판 구조 (별도 승인)<\u002Fli>\n        <li><b>개발 방식의 확정<\u002Fb> — 검증 데이터가 답한 대로<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"band\">오른쪽 문들은 닫힌 것이 아니라 <span class=\"g\">검증이 여는 문<\u002Fspan>입니다 — 그래서 두 달짜리 가벼운 첫 결정이 성립합니다.<\u002Fdiv>\n  <div class=\"sfoot\">11 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 12 · 요청드리는 결정 -->\n<div class=\"slide\">\n  <div class=\"shead\"><span>09 · 요청드리는 결정<\u002Fspan><span>바디프랜드 비욘드<\u002Fspan><\u002Fdiv>\n  <div class=\"secno\">09 · 요청드리는 결정<\u002Fdiv>\n  <h1 class=\"serif\">필요한 결정은 하나 —<br><span class=\"g\">계약 ① 승인<\u002Fspan>입니다.<\u002Fh1>\n  <div class=\"cols c2\" style=\"margin-top:8px\">\n    <div class=\"card gold\"><h4>계약 ① 승인 — 1.99억 원 · 2개월<\u002Fh4>\n    <ul>\n      <li><b>산출<\u002Fb> — 인건비와 AI 중심입니다<\u002Fli>\n      <li><b>지급<\u002Fb> — 체결 시 전액 지급입니다<\u002Fli>\n      <li><b>용도<\u002Fb> — 전액이 두 달의 실행 비용입니다<\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"card gold\"><h4>계약 안에 함께 담는 약속<\u002Fh4>\n    <ul>\n      <li><b>전용성<\u002Fb> — 결과물과 노하우는 바디프랜드 외 어디에도 제공하지 않습니다<\u002Fli>\n      <li><b>고객 정보 보호<\u002Fb> — 데이터는 고객 동의와 법령의 범위 안에서만 다룹니다<\u002Fli>\n      <li><b>원스톱<\u002Fb> — 비밀유지 약정까지 포함, 별도 계약 없이 <b>계약 ① 하나로 시작<\u002Fb>합니다<\u002Fli>\n    <\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <table style=\"margin-top:14px\">\n    <tbody><tr><th style=\"width:24%\">오늘 승인 범위<\u002Fth><td>계약 ① 하나 — 계약 ②·③, 코인 뒷단, 소사이어티 보증은 검증 결과 위에서 별도 승인<\u002Ftd><\u002Ftr>\n    <tr><th>7월 승인 시<\u002Fth><td>동작 버전(α)이 9월 출시 전 도달 — 첫 로그인 고객을 준비된 화면으로 맞이<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"sfoot\">12 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 13 · CLOSING -->\n<div class=\"slide dark\">\n  <div class=\"shead\"><span>Closing<\u002Fspan><span>LICHE · 2026.07<\u002Fspan><\u002Fdiv>\n  <div class=\"center\">\n    <div class=\"hr-gold\"><\u002Fdiv>\n    <div class=\"cover-quote\">\n      9월, 새 라인업의 첫 고객이 계정을 만듭니다.<br>\n      그 화면 뒤에 멤버십이 준비되어 있도록,<br>\n      리체는 <b style=\"color:var(--gold-bright)\">2026년 7월 착수<\u002Fb>를 제안드립니다.<br><br>\n      계약 ①을 승인해 주시면 바로 시작하겠습니다.<br>\n      연내 베타는 그 위에서 가능해집니다.\n    <\u002Fdiv>\n    <div class=\"hr-gold\"><\u002Fdiv>\n    <div class=\"tagline\">LICHE · 바디프랜드 멤버십 메타버스 · 바디프랜드 전용 프로젝트 · 대외비<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sfoot\">13 / 13<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
